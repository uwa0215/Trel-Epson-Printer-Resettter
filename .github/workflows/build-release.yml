name: Build & Release Windows Executables

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to publish under GitHub Releases (e.g. v1.0.0). Leave blank to build artifacts only."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build native 32-bit spooler bridge
        run: npm run build:native

      - name: Build UI and Windows installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TREL-Windows-Installers
          path: release/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: release/*.exe
